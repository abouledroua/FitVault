<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitVault - Loading</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0B0F17; /* Midnight Slate */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            border-radius: 12px;
            box-sizing: border-box;
            border: 1px solid #1E293B;
        }
        .logo {
            margin-bottom: 30px;
        }
        .progress-container {
            width: 80%;
            height: 4px;
            background-color: #1E293B;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #06B6D4, #10B981);
            width: 0%;
            animation: load 2s ease-in-out forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: #94A3B8;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="80" height="80" fill="none">
            <rect width="48" height="48" rx="12" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5"/>
            <defs>
              <linearGradient id="fitVaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#06B6D4" />
                <stop offset="100%" stop-color="#10B981" />
              </linearGradient>
            </defs>
            <path d="M24 8L36 13V22C36 30 24 38 24 38C24 38 12 30 12 22V13L24 8Z" stroke="url(#fitVaultGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 18V28M24 16V30M28 18V28" stroke="url(#fitVaultGrad)" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>
    <h1>FitVault</h1>
    <p>Smart Athletic Operations</p>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</body>
</html>
